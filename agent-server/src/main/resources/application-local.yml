spring:
  datasource:
    url: jdbc:h2:file:./data/agent-platform-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

app:
  cache:
    redis-enabled: false
  rag:
    milvus-enabled: false
