server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: java-agent-platform
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agent_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:agent123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      repositories:
        enabled: false
  cache:
    type: simple
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  cache:
    redis-enabled: ${REDIS_CACHE_ENABLED:true}
  agent-registry:
    heartbeat-timeout: 60s
    cleanup-interval: 30s
  task:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 200
    thread-name-prefix: agent-task-
  review:
    storage-dir: ${REVIEW_STORAGE_DIR:data/reports}
    max-files: 200
  rag:
    milvus-enabled: ${MILVUS_ENABLED:false}
    milvus-host: ${MILVUS_HOST:localhost}
    milvus-port: ${MILVUS_PORT:19530}
    milvus-collection-name: ${MILVUS_COLLECTION_NAME:agent_platform_embeddings}
    milvus-database-name: ${MILVUS_DATABASE_NAME:}
    milvus-username: ${MILVUS_USERNAME:}
    milvus-password: ${MILVUS_PASSWORD:}
  llm:
    provider: openai
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model-name: ${LLM_MODEL_NAME:gpt-4o-mini}
    temperature: 0.2
    timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.agentplatform: INFO
