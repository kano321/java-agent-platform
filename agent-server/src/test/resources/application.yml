spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

app:
  cache:
    redis-enabled: false
  review:
    storage-dir: ${java.io.tmpdir}/agent-platform-test-reports
  rag:
    milvus-enabled: false
